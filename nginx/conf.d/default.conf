# darkmatter-site (nginx-unprivileged, listens on 8080 inside the container).
# Public traffic arrives from the VPS nginx over WireGuard; the VPS terminates TLS and adds the
# security headers and CSP, so they are not repeated here.
# Serves the static site in public/ (home + one folder per page, each with an index.html; Batch R),
# its robots.txt, sitemap.xml and site.webmanifest, a styled 404 page, and proxies the contact form
# to the mailer. CI (.github/workflows/check.yml) runs `nginx -t` on this file and a smoke test that
# starts this exact image with this file and curls the behaviour described here.

# 6 contact-form posts a minute per client, small burst. Keyed on the real client (see real_ip).
limit_req_zone $binary_remote_addr zone=support:1m rate=6r/m;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  absolute_redirect off;  # R2: the directory 301 (/contact -> /contact/) sends a relative Location; an absolute one would name this container's http://host:8080, which the public can't reach

  # R2: every 404 (missing files, /api/ and the deny rules below) shows the styled page; the status stays 404.
  # Only 404 is mapped: 403/429/5xx keep nginx's plain bodies so nothing else changes.
  error_page 404 /404.html;

  # Only the VPS may tell us who the client is. It appends the client to X-Forwarded-For, so with
  # recursive lookup the rightmost address that isn't the VPS becomes $remote_addr; anything a
  # client puts in the header itself is ignored. Direct requests (e.g. the deploy health check)
  # keep their own address.
  set_real_ip_from 10.50.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  # text/html is always compressed by nginx; xml (sitemap) and manifest+json added by R2.
  gzip_types text/css application/javascript application/json image/svg+xml image/x-icon text/plain
             text/xml application/xml application/manifest+json;

  # Look the mailer up at request time (Docker DNS), so a rebuilt mailer with a new IP
  # doesn't leave this nginx pointing at the old one, and nginx starts even if the mailer is down.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The only API route: the contact form.
  location = /api/support {
    limit_except POST { deny all; }
    client_max_body_size 32k;
    limit_req zone=support burst=3 nodelay;
    limit_req_status 429;

    set $mailer darkmatter-mailer:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: the mailer trusts exactly this one hop.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_pass http://$mailer/support;
  }

  # Nothing else under /api/ is public (the mailer's /health stays internal).
  location /api/ {
    return 404;
  }

  # Never serve dotfiles or stray scripts/configs from the web root.
  location ~ /\. {
    return 404;
  }
  location ~* \.(sh|env|log|bak|md|ya?ml|conf)$ {
    return 404;
  }

  # The 404 page is only ever served through error_page above; asked for directly it is itself a 404
  # (with the same page), so search engines never see a 200 copy of it.
  location = /404.html {
    internal;
  }

  location ~* \.(png|ico|svg|webp|jpe?g|woff2?)$ {
    expires 7d;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location ~* \.(css|js)$ {
    expires 1h;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # R2: robots.txt, sitemap.xml, site.webmanifest change with the site, so a short cache.
  # The types block names the three types here instead of relying on the image's mime.types
  # (older ones have no webmanifest entry); it replaces the type map for this location only.
  location ~* \.(xml|txt|webmanifest)$ {
    types {
      text/xml xml;
      text/plain txt;
      application/manifest+json webmanifest;
    }
    expires 1h;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Pages: /x/ serves x/index.html. /x (no slash) on a folder gets a 301 to /x/ (relative, see
  # absolute_redirect). Anything that doesn't exist is a real 404 with the page from error_page.
  location / {
    try_files $uri $uri/ =404;
  }
}
