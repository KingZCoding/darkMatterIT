# Checks only. This workflow never deploys and never runs on the Pi.
#
# Deploys are PULLED by the Pi: a root systemd timer (deploy-darkmatterits.timer) fetches main
# from GitHub, waits until this workflow's `check` job has passed for that exact commit, then
# deploys it. Nothing in GitHub can reach the Pi, so fork PRs and other branches can't either.
# See DEPLOY.md.

name: check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Pi looks for a successful check run with exactly this name. Don't rename it.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Mailer tests
        working-directory: mailer
        run: |
          npm ci --ignore-scripts
          node --check server.js
          npm test
      - name: Site checks
        run: |
          test -s public/index.html && test -s public/script.js && test -s public/styles.css
          node --check public/script.js
          if find public -name '*.sh' -o -name '.*' -not -name public | grep -q .; then
            echo "::error::Scripts or dotfiles in the web root"; exit 1
          fi
      - name: No symlinks or submodules (the Pi refuses them)
        run: |
          if git ls-files -s | awk '$1 == "120000" || $1 == "160000" {f=1} END {exit !f}'; then
            echo "::error::Symlinks or submodules are not allowed"; exit 1
          fi
      - name: Compose file check
        run: |
          if grep -nE '\$|external|label_file|cache_(from|to)|ssh:|include:|extends:' docker-compose.yml; then
            echo "::error::docker-compose.yml uses something the Pi's deploy refuses"; exit 1
          fi
          touch mailer/.env
          docker compose -f docker-compose.yml config -q
      - name: nginx config check
        run: |
          docker run --rm \
            -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/public:/usr/share/nginx/html:ro" \
            nginxinc/nginx-unprivileged:1.27-alpine nginx -t
