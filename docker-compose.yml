# darkmatterits.com on the Pi (/data/sites/newsite, compose project "newsite").
# Deployed by deploy/pi/deploy-darkmatterits, which checks this file with the strict allowlist
# deploy/pi/darkmatterits-compose-check (then compose-guard) before compose reads it. The allowlist
# requires read_only, cap_drop ALL and no-new-privileges on every service, read-only ./src:/dst:ro
# mounts only, env_file ./mailer/.env only, the pinned image, and the one port 10.50.0.3:8085:8080.
# Changing any of that means changing the allowlist and its tests (deploy/pi/test/) on purpose.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  darkmatter-site:
    # Pinned by digest (D3b): see DEPLOY.md "Updating base images"; the Pi allowlist must match.
    image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    container_name: darkmatter-site
    restart: unless-stopped
    ports:
      - "10.50.0.3:8085:8080"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - darkmatter-mailer
    logging: *logging

  darkmatter-mailer:
    build: ./mailer
    container_name: darkmatter-mailer
    restart: unless-stopped
    env_file:
      - ./mailer/.env
    environment:
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging
